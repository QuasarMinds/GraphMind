[project]
name = "graphmind-engine"
version = "0.1.0"
description = "GraphMind repository intelligence and context optimization engine"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.2",
    "tree-sitter>=0.21",
    "tree-sitter-python>=0.21",
    "tree-sitter-javascript>=0.21",
    "sqlalchemy>=2.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "sentence-transformers>=2.7",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "aiofiles>=23.2",
    "rich>=13.7",
    "toml>=0.10",
    "chardet>=5.2",
    "gitpython>=3.1",
    "watchdog>=4.0",
    "tiktoken>=0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["graphmind*"]
