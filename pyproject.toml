[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "graphmind"
version = "0.1.0"
description = "Graph-Aware Context Optimization Engine for AI Coding Agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "GraphMind Contributors" }]

[tool.setuptools.packages.find]
where = ["engine", "agent", "api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["engine/tests", "agent/tests", "tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
